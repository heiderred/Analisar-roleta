<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Sistema de Gestão - versão standalone" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <title>Sistema de Gestão (Standalone)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Inter", system-ui, sans-serif; background: #0f1115; color: #e6e8ee; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #151923; padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; border-right: 1px solid #232838; }
    .logo { font-weight: 700; font-size: 18px; margin-bottom: 24px; color: #fff; }
    .nav-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; color: #9aa3b5; font-weight: 600; font-size: 14px; }
    .nav-item:hover { background: #1e2433; color: #fff; }
    .nav-item.active { background: #2563eb; color: #fff; }
    .main { flex: 1; padding: 32px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .topbar h1 { font-size: 22px; font-weight: 700; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .card { background: #151923; border: 1px solid #232838; border-radius: 12px; padding: 20px; }
    .card .label { font-size: 12px; color: #9aa3b5; text-transform: uppercase; letter-spacing: .05em; }
    .card .value { font-size: 28px; font-weight: 700; margin-top: 8px; }
    .panel { background: #151923; border: 1px solid #232838; border-radius: 12px; padding: 24px; }
    .panel h2 { font-size: 16px; margin-bottom: 16px; }
    .task-form { display: flex; gap: 8px; margin-bottom: 16px; }
    .task-form input { flex: 1; background: #0f1115; border: 1px solid #2a3145; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px; }
    .btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn:hover { background: #1d4ed8; }
    .btn-danger { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 6px 10px; font-size: 12px; }
    .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .task-item { display: flex; align-items: center; gap: 12px; background: #0f1115; border: 1px solid #232838; border-radius: 8px; padding: 12px 14px; }
    .task-item span { flex: 1; font-size: 14px; }
    .task-item.done span { text-decoration: line-through; color: #6b7280; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { useState } = React;

    const initialTasks = [
      { id: 1, title: "Configurar projeto no Emergent", done: true },
      { id: 2, title: "Conectar backend / banco de dados", done: false },
      { id: 3, title: "Publicar versão 1.0", done: false },
    ];

    function App() {
      const [tasks, setTasks] = useState(initialTasks);
      const [newTask, setNewTask] = useState("");

      const addTask = (e) => {
        e.preventDefault();
        if (!newTask.trim()) return;
        setTasks([...tasks, { id: Date.now(), title: newTask.trim(), done: false }]);
        setNewTask("");
      };
      const toggleTask = (id) => setTasks(tasks.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
      const removeTask = (id) => setTasks(tasks.filter((t) => t.id !== id));
      const done = tasks.filter((t) => t.done).length;

      return (
        <div className="app">
          <aside className="sidebar">
            <div className="logo">⚡ Meu Sistema</div>
            <div className="nav-item active">Dashboard</div>
            <div className="nav-item">Tarefas</div>
            <div className="nav-item">Relatórios</div>
            <div className="nav-item">Configurações</div>
          </aside>
          <main className="main">
            <div className="topbar">
              <h1>Dashboard</h1>
              <button className="btn">+ Nova ação</button>
            </div>
            <div className="cards">
              <div className="card"><div className="label">Tarefas totais</div><div className="value">{tasks.length}</div></div>
              <div className="card"><div className="label">Concluídas</div><div className="value">{done}</div></div>
              <div className="card"><div className="label">Pendentes</div><div className="value">{tasks.length - done}</div></div>
            </div>
            <div className="panel">
              <h2>Gerenciador de tarefas</h2>
              <form className="task-form" onSubmit={addTask}>
                <input placeholder="Digite uma nova tarefa..." value={newTask} onChange={(e) => setNewTask(e.target.value)} />
                <button className="btn" type="submit">Adicionar</button>
              </form>
              <ul className="task-list">
                {tasks.map((t) => (
                  <li key={t.id} className={"task-item" + (t.done ? " done" : "")}>
                    <input type="checkbox" checked={t.done} onChange={() => toggleTask(t.id)} />
                    <span>{t.title}</span>
                    <button className="btn btn-danger" onClick={() => removeTask(t.id)}>Excluir</button>
                  </li>
                ))}
              </ul>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
